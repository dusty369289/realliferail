[project]
name = "realliferail"
version = "0.1.0"
description = "Live GB train tracker that places your train between stations using Realtime Trains timing points."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
realliferail = "realliferail.cli.main:app"

[dependency-groups]
dev = [
    "pillow>=11",
    "playwright>=1.50",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realliferail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10 # a hung test fails with a stack trace. A hang is a bug, not a limit to raise.
addopts = "-n 4 -m 'not ui and not live'"
tmp_path_retention_policy = "failed"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "ui: browser screenshots across phone and desktop. Run with: pytest -m ui",
    "live: real RTT calls, costs allowance, needs RTT_TOKEN. Run with: pytest -m live -n 0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/realliferail/cli/main.py" = ["B008"]
"src/realliferail/web/app.py" = ["B008"]
"src/realliferail/sources/simulator.py" = ["E501"] # route tables and JSON shapes read best on one line
"scripts/*" = ["E501"]
